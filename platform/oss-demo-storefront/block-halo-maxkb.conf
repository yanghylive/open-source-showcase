# 显式屏蔽已废弃的飞致云系子域，避免 default_server 兜底泄漏其他子域内容
server {
    listen 80;
    listen [::]:80;
    server_name halo.opensource.kaypal.cn maxkb.opensource.kaypal.cn;
    return 444;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name halo.opensource.kaypal.cn maxkb.opensource.kaypal.cn;

    ssl_certificate     /etc/nginx/ssl/opensource-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opensource-wildcard/privkey.pem;

    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name drama.opensource.kaypal.cn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drama.opensource.kaypal.cn;

    ssl_certificate     /etc/nginx/ssl/opensource-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opensource-wildcard/privkey.pem;

    access_log /var/log/nginx/drama.opensource.kaypal.cn.access.log;
    error_log  /var/log/nginx/drama.opensource.kaypal.cn.error.log warn;

    client_max_body_size 100m;

    # Key: 反代所有 /api/* 到 Jellyfish FastAPI 后端 :8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Frontend nginx 容器服务 SPA 静态 + asset
    location / {
        proxy_pass http://127.0.0.1:7788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}

# 精选应用目录商店 — store.opensource.kaypal.cn
# 原根域商店(8099)整体迁到此子域；SPA 在根路径，绝对资源路径不受影响。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name store.opensource.kaypal.cn;

    ssl_certificate     /etc/nginx/ssl/opensource-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/opensource-wildcard/privkey.pem;

    access_log /var/log/nginx/store.opensource.kaypal.cn.access.log;
    error_log /var/log/nginx/store.opensource.kaypal.cn.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name store.opensource.kaypal.cn;
    return 301 https://$host$request_uri;
}
